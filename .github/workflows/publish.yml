name: Publish to npm

on:
  push:
    branches: [main]
    paths: [package.json]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Setup npm trusted publishing
        run: npm install --global npm@11

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm run check

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Plan release
        id: release_plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(node -p 'require("./package.json").version')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$EVENT_NAME" == "push" ]]; then
            previous=$(git show HEAD^:package.json | node -e 'let s=""; process.stdin.on("data", c => s += c); process.stdin.on("end", () => process.stdout.write(JSON.parse(s).version))')
            if [[ "$previous" == "$version" ]]; then
              echo "publish=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Main merges must use a stable package version"; exit 1; }
          elif [[ "$EVENT_NAME" == "release" ]]; then
            [[ "$RELEASE_TAG" == "v$version" ]] || { echo "Release tag must match package.json"; exit 1; }
          fi
          if npm view "codex-config@$version" version > /dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub release after version-bump merge
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.release_plan.outputs.version }}
          SHOULD_PUBLISH: ${{ steps.release_plan.outputs.publish }}
        run: |
          [[ "$SHOULD_PUBLISH" == "true" ]] || exit 0
          if ! gh release view "v$RELEASE_VERSION" > /dev/null 2>&1; then
            notes="docs/codex-$RELEASE_VERSION-analysis.md"
            if [[ -f "$notes" ]]; then
              gh release create "v$RELEASE_VERSION" --target "$GITHUB_SHA" --title "v$RELEASE_VERSION" --notes-file "$notes"
            else
              gh release create "v$RELEASE_VERSION" --target "$GITHUB_SHA" --title "v$RELEASE_VERSION" --generate-notes
            fi
          fi

      - name: Publish prerelease
        if: steps.release_plan.outputs.publish == 'true' && github.event_name == 'release' && github.event.release.prerelease
        run: npm publish --access public --tag alpha

      - name: Publish stable release
        if: steps.release_plan.outputs.publish == 'true' && (github.event_name != 'release' || !github.event.release.prerelease)
        run: npm publish --access public
